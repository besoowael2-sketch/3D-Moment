const loader = new THREE.GLTFLoader();
loader.load("cake.glb", function(gltf) {
    let cake = gltf.scene;

    // حساب الحجم والمركز
    const box = new THREE.Box3().setFromObject(cake);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    // توسيط الموديل
    cake.position.sub(center);

    // Scale
    const maxim = Math.max(size.x, size.y, size.z);
    const scale = 4 / maxim;
    cake.scale.setScalar(scale);

    // رفع التورتة فوق الترابيزة

    cake.position.z = 3.8;

    controls.target.set(0, 0, 0);
    controls.update();

    // الدوران المستمر
    cake.userData.isRotating = true;
});

function createFrame(x, y, z, imagePath){

    const group = new THREE.Group();

    const imgWidth = 2;
    const imgHeight = 1.5;
    const frameThickness = 0.12;   // سمك الإطار
    const frameDepth = 0.15;

    const textureLoader = new THREE.TextureLoader();
    const texture = textureLoader.load(imagePath);

    // الصورة
    const imgGeo = new THREE.PlaneGeometry(imgWidth, imgHeight);
    const imgMat = new THREE.MeshStandardMaterial({
        map: texture
    });

    const imageMesh = new THREE.Mesh(imgGeo, imgMat);
    group.add(imageMesh);

    // خامة الخشب
    const woodMat = new THREE.MeshStandardMaterial({
        color: 0x8b5a2b
    });

    // فوق
    const top = new THREE.Mesh(
        new THREE.BoxGeometry(imgWidth + frameThickness*2, frameThickness, frameDepth),
        woodMat
    );
    top.position.y = imgHeight/2 + frameThickness/2;
    group.add(top);

    // تحت
    const bottom = top.clone();
    bottom.position.y = -imgHeight/2 - frameThickness/2;
    group.add(bottom);

    // يمين
    const right = new THREE.Mesh(
        new THREE.BoxGeometry(frameThickness, imgHeight, frameDepth),
        woodMat
    );
    right.position.x = imgWidth/2 + frameThickness/2;
    group.add(right);

    // شمال
    const left = right.clone();
    left.position.x = -imgWidth/2 - frameThickness/2;
    group.add(left);

    group.position.set(x, -5, z);
    scene.add(group);

    // أنيميشن طلوع
    let targetY = y;

    function rise(){
        if(group.position.y < targetY){
            group.position.y += 0.05;
            requestAnimationFrame(rise);
        }
    }

    rise();
}

if(!musicStarted){

-(event.clientY/window.innerHeight)*2+1
);
const raycaster = new THREE.Raycaster();
raycaster.setFromCamera(mouse,camera);
const intersects = raycaster.intersectObject(card);
const popup = document.getElementById("cardPopup");
const inner = document.querySelector(".cardInner");

if(intersects.length > 0){

    if(popup.classList.contains("open")){

        // 🔄 يقفل
        inner.style.transform = "rotateY(0deg)";
        popup.style.bottom = window.matchMedia("(max-width: 700px)").matches ? "-110%" : "-450px";

            inner.style.transform = "rotateY(180deg)";
        },600);

        popup.classList.add("open");
    }
}

function animate(){
    requestAnimationFrame(animate);

    if (scene) scene.traverse((object) => { if (object.userData && object.userData.isRotating) object.rotation.y += 0.01; });
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene,camera);
